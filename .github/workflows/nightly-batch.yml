name: Nightly Batch Pipeline

on:
  schedule:
    # Every night at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-batch-pipeline
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Submit nightly batch
        run: npm run batch:submit
        env:
          # Required repository secrets:
          # - OPENROUTER_API_KEY
          # - NEXT_PUBLIC_SUPABASE_URL
          # - SUPABASE_SERVICE_ROLE_KEY
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BATCH_TARGET_USER_ID: ${{ secrets.BATCH_TARGET_USER_ID }}

  poll-and-ingest:
    runs-on: ubuntu-latest
    needs: submit
    if: ${{ needs.submit.result == 'success' }}
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Poll and ingest with bounded retries
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BATCH_TARGET_USER_ID: ${{ secrets.BATCH_TARGET_USER_ID }}
        run: |
          set -euo pipefail

          max_attempts=4
          attempt=1

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Polling attempt ${attempt}/${max_attempts}..."
            output_file="$(mktemp)"
            npm run batch:poll 2>&1 | tee "$output_file"

            if grep -q "Batch still in progress. Skipping ingestion for now." "$output_file"; then
              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "Batch still in progress. Waiting 5 minutes before next poll attempt..."
                sleep 300
              fi
            else
              echo "No in-progress batches detected. Finishing polling step."
              break
            fi

            attempt=$((attempt + 1))
          done

          if [ "$attempt" -gt "$max_attempts" ]; then
            echo "Reached maximum polling attempts for this run."
            echo "Any pending in-progress batches will be retried in the next nightly run."
          fi
