name: Nightly Batch Pipeline

on:
  schedule:
    - cron: '0 3 * * *' # Executa diariamente às 03:00 UTC
  workflow_dispatch:
    inputs:
      mock:
        description: 'Executar em modo simulação (--mock) sem custos de API'
        required: false
        default: 'false'
        type: boolean

jobs:
  nightly-batch:
    runs-on: ubuntu-latest

    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Nightly Batch Pipeline
        run: |
          set -euo pipefail
          MOCK_FLAG=""
          if [ "${{ github.event.inputs.mock }}" = "true" ]; then
            MOCK_FLAG="--mock"
          fi
          
          for i in 1 2 3 4; do
            echo "Polling attempt $i/4..."
            npx tsx scripts/nightly-batch-pipeline.ts $MOCK_FLAG && break
            sleep 15
          done
