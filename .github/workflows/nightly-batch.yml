name: Nightly Batch Pipeline

on:
  schedule:
    - cron: '0 3 * * *' # Executa diariamente às 03:00 UTC (00:00 BRT)
  workflow_dispatch:
    inputs:
      mock:
        description: 'Executar em modo simulação (--mock) sem custos de API'
        required: false
        default: 'false'
        type: boolean

jobs:
  nightly-batch:
    runs-on: ubuntu-latest

    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Nightly Batch Pipeline
        run: |
          set -euo pipefail
          MOCK_FLAG=""
          if [ "${{ github.event.inputs.mock }}" = "true" ]; then
            MOCK_FLAG="--mock"
          fi

          echo "--- 1. Processando lotes pendentes anteriores (se houver) ---"
          npx tsx scripts/nightly-batch-pipeline.ts --poll-and-ingest $MOCK_FLAG

          echo "--- 2. Submetendo novo lote noturno ---"
          npx tsx scripts/nightly-batch-pipeline.ts --submit $MOCK_FLAG

          echo "--- 3. Polling de ingestão ---"
          for i in 1 2 3 4; do
            echo "Polling attempt $i/4..."
            npx tsx scripts/nightly-batch-pipeline.ts --poll-and-ingest $MOCK_FLAG
            
            PENDING=$(npx tsx scripts/nightly-batch-pipeline.ts --pending-status --json | jq -r '.hasPendingSubmitted')
            if [ "$PENDING" = "false" ]; then
              echo "✓ Todos os lotes foram processados e ingeridos!"
              break
            fi
            
            if [ "$i" -lt 4 ]; then
              echo "Lote ainda em processamento. Aguardando 30s..."
              sleep 30
            fi
          done

          echo "--- 4. Status Final do Ledger ---"
          npx tsx scripts/nightly-batch-pipeline.ts --status
